apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  # Make sure the name and namespace match your instance
  name: example-keycloak
  namespace: your-project
spec:
  instances: 1
  database:
    # Specify the database vendor
    vendor: postgres
    
    # Use the decoded values from your secret for host and database name
    host: redlane-postgresql.ns1.svc.cluster.local
    database: keycloak
    
    # Reference the secret and the specific keys for credentials
    usernameSecret:
      name: keycloak-db-secret
      key: POSTGRES_USERNAME
    passwordSecret:
      name: keycloak-db-secret
      key: POSTGRES_PASSWORD
