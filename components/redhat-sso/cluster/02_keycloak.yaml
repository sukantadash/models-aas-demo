apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  # Make sure the name and namespace match your instance
  name: example-keycloak
  namespace: your-project
spec:
  instances: 1
  # This 'keycloak' block with environment variables is the correct method
  # for the operator version you are using.
  keycloak:
    env:
      - name: DB_VENDOR
        value: "postgres"
      # This is the DB host from your YAML file.
      # Ensure this is the correct service name for your PostgreSQL.
      - name: DB_ADDR
        value: "rh-bk-postgresql.rh-bk.svc.cluster.local"
      - name: DB_DATABASE
        value: "keycloak"
      - name: DB_USER
        # This references the username from your secret
        valueFrom:
          secretKeyRef:
            name: keycloak-db-secret
            key: POSTGRES_USERNAME
      - name: DB_PASSWORD
        # This references the password from your secret
        valueFrom:
          secretKeyRef:
            name: keycloak-db-secret
            key: POSTGRES_PASSWORD
      # It's good practice to enable this when running behind an OpenShift Route
      - name: PROXY_ADDRESS_FORWARDING
        value: "true"
